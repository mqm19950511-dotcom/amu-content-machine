<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{ --ink:#171614; --yellow:#F2E27A; --accent:#FF5FA2; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1440px;overflow:hidden}
  body{font-family:"PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;background:#222;position:relative}

  .photo{position:absolute;inset:0;width:1080px;height:1440px;object-fit:cover;object-position:center 26%}
  /* subtle darken at the very bottom, only so white text is legible — not a color block */
  .scrim{position:absolute;left:0;right:0;bottom:0;height:620px;
    background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 100%)}

  .title{position:absolute;left:60px;right:60px;bottom:72px;z-index:2;
    font-size:92px;line-height:1.18;font-weight:800;color:#fff;letter-spacing:-.015em;
    text-shadow:0 3px 24px rgba(0,0,0,.55)}
  /* eye-catching highlight box on the key word */
  .title .mark{white-space:nowrap;padding:4px 16px;border-radius:12px;
    background:var(--yellow);color:var(--ink);text-shadow:none;
    box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .title .pop{color:var(--accent)}

  /* no-photo variant: dark poster, big type */
  body.nobg{background:var(--ink)}
  body.nobg .photo,body.nobg .scrim{display:none}
  body.nobg .title{bottom:auto;top:50%;transform:translateY(-50%);font-size:108px;text-shadow:none}
</style></head>
<body>
  <img class="photo" id="photo" alt="">
  <div class="scrim" id="scrim"></div>
  <div class="title" id="title"></div>
<script>
  const p=new URLSearchParams(location.search), dec=v=>decodeURIComponent(v||'');
  let t=dec(p.get('t'))
    .replace(/【(.+?)】/g,'<span class="mark">$1</span>')   // 【..】 = highlight box
    .replace(/「(.+?)」/g,'<span class="pop">$1</span>');   // 「..」 = accent color
  document.getElementById('title').innerHTML=t;
  const bg=p.get('bg');
  if(bg) document.getElementById('photo').src=dec(bg);
  else { document.body.classList.add('nobg'); document.getElementById('scrim').style.display='none'; }
</script>
</body></html>
